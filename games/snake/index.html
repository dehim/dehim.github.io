<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇 | Dehim 小游戏</title>
  <meta name="description" content="纯前端贪吃蛇小游戏，支持方向键和移动端方向按钮。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-panel" aria-labelledby="game-title">
      <div class="game-copy">
        <a class="back-link" href="../../">返回游戏列表</a>
        <p class="eyebrow">Classic Arcade</p>
        <h1 id="game-title">贪吃蛇</h1>
        <p class="intro">吃到红色食物得分，避开墙壁和自己的身体。桌面端使用方向键，移动端使用下方方向按钮。</p>
      </div>

      <div class="score-board" aria-label="分数">
        <div>
          <span>分数</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>最高分</span>
          <strong id="best-score">0</strong>
        </div>
      </div>

      <div class="board-wrap">
        <canvas id="game-board" width="480" height="480" aria-label="贪吃蛇游戏棋盘"></canvas>
        <div id="game-message" class="game-message">按开始游戏</div>
      </div>

      <div class="controls">
        <button id="start-button" type="button">开始</button>
        <button id="pause-button" type="button">暂停</button>
        <button id="restart-button" type="button">重新开始</button>
      </div>

      <div class="direction-pad" aria-label="移动方向">
        <button class="direction direction-up" type="button" data-direction="up" aria-label="向上">↑</button>
        <button class="direction direction-left" type="button" data-direction="left" aria-label="向左">←</button>
        <button class="direction direction-right" type="button" data-direction="right" aria-label="向右">→</button>
        <button class="direction direction-down" type="button" data-direction="down" aria-label="向下">↓</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
